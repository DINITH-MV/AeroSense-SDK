# WildBridge six-drone WebRTC relay.
# Phones publish via WHIP: http://<host>:8889/<drone_name>/whip
# Browsers consume via WHEP: http://<host>:8889/<drone_name>/whep

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997
apiAllowOrigins: ["*"]

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcIPsFromInterfaces: yes
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

rtsp: no

hls: no
rtmp: no
srt: no

paths:
  # UDP/RTP mock video path: phone pushes raw H.264 RTP packets to udp://<host>:8004
  # Browser consumes via WebRTC WHEP: http://<host>:8889/drone_1_udp/whep
  drone_1_udp:
    source: udp+rtp://0.0.0.0:8004
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 0.0.0.0
      s=WildBridge Mock Video
      c=IN IP4 0.0.0.0
      t=0 0
      m=video 8004 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 profile-level-id=42e01e;packetization-mode=1
    sourceOnDemand: no

  all_others:
